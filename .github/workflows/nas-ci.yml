name: NAS CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: nas-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    uses: ./.github/workflows/test.yml
  image:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Build custom server without upstream app credentials
        run: bash deploy/nas/build.sh ma-server:test
      - name: Verify installed version and absence of bundled app credentials
        run: >-
          docker run --rm --entrypoint python ma-server:test -c
          'import importlib.metadata, importlib.resources; print(importlib.metadata.version("music-assistant")); assert not (importlib.resources.files("music_assistant.helpers") / "app_secrets.json").is_file()'
