name: NAS CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: nas-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    uses: ./.github/workflows/test.yml
  # Builds alongside the tests rather than after them: a deployment needs the whole
  # run to succeed, so the image is still only deployed once the tests pass.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Build fork on the pinned official runtime
        run: bash deploy/nas/build.sh ma-server:test
      - name: Verify fork version and trusted-network module
        run: >-
          docker run --rm --entrypoint python ma-server:test -c
          'import importlib.metadata; from music_assistant.controllers.webserver.helpers.trusted_network import TrustedNetworkPolicy; assert "+g" in importlib.metadata.version("music-assistant"); assert not TrustedNetworkPolicy().enabled'
